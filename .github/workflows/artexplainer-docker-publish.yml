name: ARTExplainer Docker Publisher

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
      - master
      - temp-v1

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

env:
  IMAGE_NAME: art-explainer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run tests.
  # See also https://docs.docker.com/docker-hub/builds/automated-testing/
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # ⏱️ allows up to 12 hours (default is 360 minutes)
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Free-up disk space
        uses: ./.github/actions/free-up-disk-space

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      # - name: Fix cgroup permissions (ppc64le)
      #   run: |
      #     sudo mount -t cgroup2 none /sys/fs/cgroup || true
      #     sudo chmod 755 /sys/fs/cgroup || true
      # - name: Run tests
      #   run: |
      #     export DOCKER_BUILDKIT=0
      #     docker build -t art-explainer:test -f python/artexplainer.Dockerfile python
      - name: Run tests
        uses: docker/build-push-action@v5
        with:
          platforms: linux/ppc64le
          context: python
          file: python/artexplainer.Dockerfile
          push: false
          # https://github.com/docker/buildx/issues/1533
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    # Ensure test job passes before pushing image.
    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 720  # ⏱️ allows up to 12 hours (default is 360 minutes)
    if: github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Export version variable
        run: |
          IMAGE_ID=kserve/$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          # [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest

          echo VERSION=$VERSION >> $GITHUB_ENV
          echo IMAGE_ID=$IMAGE_ID >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/ppc64le
          context: python
          file: python/artexplainer.Dockerfile
          push: true
          tags: ${{ env.IMAGE_ID }}:${{ env.VERSION }}
          # https://github.com/docker/buildx/issues/1533
          provenance: false
          sbom: true
